<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="apple-mobile-web-app-title" content="CKタスク">
<meta name="theme-color" content="#f6efe4">
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKタスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
/* Layout: 現場で片手で見るリスト。上に要約、フィルタ、期限順のタスク行。タップで下から編集シート */
:root{
  --bg:#f6efe4; --surface:#fffaf3; --ink:#3d302a; --muted:#8b7a6c; --line:#e7d9c6;
  --accent:#e9a48c; --accent-ink:#3d302a; --accent-soft:#f4dccf;
  --s-todo:#7c7166; --s-todo-bg:#ece3d6;
  --s-doing:#4d7088; --s-doing-bg:#dae6ee;
  --s-wait:#94701f; --s-wait-bg:#f5e5bc;
  --s-check:#b0545e; --s-check-bg:#f6d8da;
  --s-done:#5c7d4f; --s-done-bg:#dfe9d2;
  --s-hold:#7b6692; --s-hold-bg:#e9e0f0;
  --over:#b0545e;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Noto Sans JP","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a221e; --surface:#352b26; --ink:#f3e8da; --muted:#bba895; --line:#4c3f37;
  --accent:#e3957b; --accent-ink:#2a1812; --accent-soft:#4d3228;
  --s-todo:#c9bcae; --s-todo-bg:#40362f; --s-doing:#9cc0d8; --s-doing-bg:#2c3a44;
  --s-wait:#ecc66e; --s-wait-bg:#463a1f; --s-check:#ee9da4; --s-check-bg:#4a2b2e;
  --s-done:#a9cb98; --s-done-bg:#2f3f29; --s-hold:#c8b4e0; --s-hold-bg:#3a3146; --over:#ee9da4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a221e; --surface:#352b26; --ink:#f3e8da; --muted:#bba895; --line:#4c3f37;
  --accent:#e3957b; --accent-ink:#2a1812; --accent-soft:#4d3228;
  --s-todo:#c9bcae; --s-todo-bg:#40362f; --s-doing:#9cc0d8; --s-doing-bg:#2c3a44;
  --s-wait:#ecc66e; --s-wait-bg:#463a1f; --s-check:#ee9da4; --s-check-bg:#4a2b2e;
  --s-done:#a9cb98; --s-done-bg:#2f3f29; --s-hold:#c8b4e0; --s-hold-bg:#3a3146; --over:#ee9da4;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.02em}
h1 small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted);letter-spacing:.12em;font-weight:500}
.notice{background:var(--s-wait-bg);color:var(--s-wait);border-radius:8px;padding:10px 12px;font-size:.88rem}
.mine{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mine-head{display:flex;align-items:center;gap:8px;font-size:.85rem;flex-wrap:wrap}
.mine-head select{background:var(--surface);color:var(--ink);border:0;padding:4px 8px;font-weight:700}
.mine-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.mine-big .who{font-weight:700;font-size:1rem}
.mine-big b{font-family:var(--f-num);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.mine-big .unit{font-weight:700}
.ask{background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.ask .people-pick{display:flex;flex-wrap:wrap;gap:6px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum{background:var(--surface);border:2px solid transparent;border-radius:10px;padding:6px 8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.sum b{display:block;font-family:var(--f-num);font-size:1.25rem;line-height:1.2;font-variant-numeric:tabular-nums}
.sum span{font-size:.72rem;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.sum.zero b{color:var(--muted)}
.sum.over b{color:var(--over)}
.sum[aria-pressed="true"]{border-color:var(--ink)}
.sum.over:not(.zero){background:var(--s-check-bg)}
.filters{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#q{flex:1 1 180px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.count{font-size:.8rem;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.task{border-top:1px solid var(--line)}
li.task:first-child{border-top:0}
li.task{display:flex;align-items:center}
li.task .open{all:unset;box-sizing:border-box;flex:1;min-width:0;display:grid;grid-template-columns:4.6rem 1fr;gap:4px 12px;padding:12px 14px;cursor:pointer}
li.task .open:hover{background:var(--bg)}
li.task .open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
li.task.is-done .title{color:var(--muted)}
.arc{flex:0 0 auto;margin-right:12px;font:inherit;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
li.sect{padding:10px 14px;background:var(--s-done-bg);color:var(--s-done);font-weight:700;font-size:.85rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
li.sect span{font-weight:400;font-size:.75rem}
li.sect.now{background:var(--s-doing-bg);color:var(--s-doing)}
li.sect.wait{background:var(--s-wait-bg);color:var(--s-wait)}
li.task.is-wait .title{color:var(--muted)}
.ordbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ordbar .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mv{flex:0 0 auto;display:flex;gap:4px;margin-right:10px}
.mv button{font:inherit;font-size:1rem;font-weight:700;min-width:2.4rem;min-height:2.4rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer}
.mv button:disabled{opacity:.3;cursor:default}
.st-next{color:var(--muted);background:transparent;border:1px dashed var(--line)}
.st-arch{color:var(--muted);background:var(--s-todo-bg)}
.projtag{color:var(--accent);font-weight:700}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;font:inherit;font-weight:700;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.projlist{display:flex;flex-direction:column;gap:12px}
.proj{padding:14px;display:flex;flex-direction:column;gap:8px}
.proj.finished{opacity:.7}
.proj-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proj h3{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.prog{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.prog b{font-size:1.4rem;color:var(--ink)}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
ol.steps li .open{all:unset;box-sizing:border-box;display:flex;gap:10px;width:100%;padding:8px 4px;cursor:pointer;border-radius:8px}
ol.steps li .open:hover{background:var(--bg)}
ol.steps li .open:focus-visible{outline:2px solid var(--accent)}
.num{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:.85rem;border:2px solid var(--line);color:var(--muted);background:var(--surface)}
.s-done .num{background:var(--s-done);border-color:var(--s-done);color:var(--surface)}
.s-cur .num{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.s-cur .st-title{font-weight:700}
.s-wait .st-title{color:var(--muted)}
.st-title{overflow-wrap:anywhere}
.projinfo{margin:0;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:.85rem}
.donebar{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px}
.donebar .lab{font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.06em}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dgrid .btn{padding:9px 8px;font-size:.88rem}
.btn.chk{background:var(--s-doing);border-color:var(--s-doing);color:var(--surface)}
.btn.ghost{background:var(--surface)}
.btn.done.ghost{background:var(--surface);color:var(--s-done)}
.btn.chk.ghost{background:var(--surface);color:var(--s-doing)}
.small-btn{font-size:.8rem;padding:6px 10px}
.srow{display:grid;grid-template-columns:1.4rem 1fr 6.5rem 2rem;grid-template-areas:"n t w x" ". d d .";gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.srow > *{min-width:0}
.snum{grid-area:n;font-family:var(--f-num);color:var(--accent);font-weight:700}
.s-title{grid-area:t}.s-who{grid-area:w}.s-due{grid-area:d;justify-self:start}
.x2{grid-area:x;border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer}
.due{font-family:var(--f-num);font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.3}
.due em{display:block;font-style:normal;font-family:var(--f-body);font-size:.72rem;font-weight:700}
.due.over{color:var(--over)}
.due.soon{color:var(--s-wait)}
.main{min-width:0;display:flex;flex-direction:column;gap:4px}
.title{font-weight:700;overflow-wrap:anywhere}
.title.hi::before{content:"!";display:inline-block;color:var(--over);font-family:var(--f-num);margin-right:4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:.78rem;color:var(--muted);align-items:center}
.pill{display:inline-block;border-radius:4px;padding:1px 7px;font-size:.74rem;font-weight:700}
.st-todo{color:var(--s-todo);background:var(--s-todo-bg)}
.st-doing{color:var(--s-doing);background:var(--s-doing-bg)}
.st-wait{color:var(--s-wait);background:var(--s-wait-bg)}
.st-check{color:var(--s-check);background:var(--s-check-bg)}
.st-done{color:var(--s-done);background:var(--s-done-bg)}
.st-hold{color:var(--s-hold);background:var(--s-hold-bg)}
.memo1{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.fab:disabled{opacity:.4;cursor:default}
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0;font-size:1.05rem}
.field{display:flex;flex-direction:column;gap:4px}
.field > label,.field > .lab{font-size:.78rem;color:var(--muted);letter-spacing:.06em;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > *{min-width:0}
.grid2 input,.grid2 select{width:100%}
textarea{min-height:90px;resize:vertical;width:100%}
textarea.title-in{min-height:5.2em;font-size:1.05rem;font-weight:700;line-height:1.5}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;cursor:pointer}
.people label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.people input{margin:0;accent-color:var(--accent)}
.dkrow{margin-bottom:6px}
.dkrow label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.due.asap{color:var(--over);font-family:var(--f-body);font-weight:700;font-size:.78rem}
.due.later{color:var(--muted);font-family:var(--f-body);font-size:.78rem}
.due .dkl{display:block;font-style:normal;font-family:var(--f-body);font-size:.7rem;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--over);border-color:var(--over)}
.spacer{flex:1}
.cal{font-size:.88rem;align-self:flex-start}
.atts{display:flex;flex-wrap:wrap;gap:10px}
.att{position:relative}
.att img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;background:var(--bg)}
.att .doc{display:inline-block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;max-width:220px;overflow-wrap:anywhere;color:var(--ink);text-decoration:none;font-size:.85rem;background:var(--surface)}
.att .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:14px;line-height:24px;padding:0}
.upl{align-self:flex-start;font-size:.88rem}
.report{background:var(--s-done-bg);border-radius:10px;padding:10px}
.ba{background:var(--s-done-bg);border-radius:10px;padding:10px}
.bagrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bacol{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:8px;padding:8px;border:2px solid var(--line)}
.bacol.bef{border-color:#e7b9a6}.bacol.aft{border-color:#9ccfae}
.batag{font-size:1rem;white-space:nowrap}.batag small{font-size:.7rem;letter-spacing:.08em;opacity:.7}
.bacol .att img{width:72px;height:72px}
.bacol.bef .batag::before{content:"① ";}.bacol.aft .batag::before{content:"② ";}
.bacol .upl{font-size:.85rem;padding:8px 10px;align-self:stretch;text-align:center}
.repbox{background:var(--s-done-bg);border-radius:10px;padding:10px;display:block}
.repbox>summary{font-weight:700;cursor:pointer;padding:2px 0 6px}
.repbox .field{margin-top:8px}
.repbox textarea,.repbox input{width:100%;box-sizing:border-box}
#r-prev{margin-top:6px;align-self:flex-start}
.shubox{background:var(--s-doing-bg)}
.shubox .reqbar{border-top-color:var(--line)}
.report > .lab{color:var(--s-done)!important;font-weight:700!important}
.btn.done{background:var(--s-done);border-color:var(--s-done);color:var(--surface)}
.rep{color:var(--s-done);font-weight:700}
.repreq{color:var(--s-wait);background:var(--s-wait-bg);border-radius:4px;padding:1px 7px;font-weight:700}
.reqbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.reqbar .st{font-weight:700;font-size:.88rem}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.calbox{display:flex;flex-direction:column;gap:4px}
.small{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:30}
@media (max-width:440px){.grid2{grid-template-columns:1fr 1fr}.sum{padding:6px}.sum span{font-size:.68rem}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* たのしい色：数字のタイルを1枚ずつ色分け */
.sum[data-quick="week"]{background:var(--s-wait-bg)}
.sum[data-quick="doing"]{background:var(--s-doing-bg)}
.sum[data-quick="todo"]{background:var(--s-done-bg)}
.mine{background:linear-gradient(135deg,#f7c9bb 0%,#f8e1c4 50%,#d3e6c8 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mine{background:linear-gradient(135deg,#6f5160 0%,#5d6a58 100%);color:#fbefe6}}
:root[data-theme="dark"] .mine{background:linear-gradient(135deg,#6f5160 0%,#5d6a58 100%);color:#fbefe6}
.mine{color:#3d302a}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.fab{background:var(--accent)}

/* ===== 着せかえ（2か月ごとに自動で変わる） ===== */
.skinpick{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted)}
.skinpick select{font-size:.78rem;padding:4px 6px;border-radius:999px}
:root[data-skin]{color-scheme:light}
:root[data-skin="vivid"]{--bg:#fffdf3;--surface:#ffffff;--ink:#161616;--muted:#555555;--line:#e3dfcf;--accent:#e63946;--accent-ink:#ffffff;--accent-soft:#ffd7da;
  --s-todo:#444444;--s-todo-bg:#eeeeee;--s-doing:#1d4ed8;--s-doing-bg:#dbe5ff;--s-wait:#a46a00;--s-wait-bg:#ffe680;--s-check:#d62839;--s-check-bg:#ffd7da;--s-done:#15803d;--s-done-bg:#c6f3d1;--s-hold:#7c3aed;--s-hold-bg:#ece1ff;--over:#d62839}
:root[data-skin="vivid"] .mine{background:#1d4ed8;color:#fff}
:root[data-skin="vivid"] .sum.over:not(.zero){background:#ffd7da}
:root[data-skin="vivid"] .sum[data-quick="week"]{background:#ffe680}
:root[data-skin="vivid"] .sum[data-quick="doing"]{background:#ffffff}
:root[data-skin="vivid"] .sum[data-quick="todo"]{background:#c6f3d1}
:root[data-skin="vivid"] .tabs button[aria-selected="true"]{background:#161616;color:#ffe680}
:root[data-skin="candy"]{--bg:#fdf5fa;--surface:#ffffff;--ink:#4a3a52;--muted:#8c7a96;--line:#f0dcec;--accent:#e384b2;--accent-ink:#ffffff;--accent-soft:#fbe0ee;

:root[data-skin="tiger"] .mine-head,:root[data-skin="tiger"] .mine-big{background:rgba(255,248,236,.94);border-radius:10px;padding:6px 10px;align-self:flex-start}
:root[data-skin="tiger"] .tabs button[aria-selected="true"]{background:#1c1410;color:#f39a2e}
:root[data-skin="nordic"]{--bg:#f2f0eb;--surface:#ffffff;--ink:#2d393e;--muted:#77848a;--line:#dddfdb;--accent:#4c8889;--accent-ink:#ffffff;--accent-soft:#d8eaea;
  --s-todo:#77848a;--s-todo-bg:#e9eae6;--s-doing:#3f6f98;--s-doing-bg:#dce8f2;--s-wait:#a57d1e;--s-wait-bg:#f6ebc8;--s-check:#b55a52;--s-check-bg:#f4dcd8;--s-done:#55794d;--s-done-bg:#dfeadb;--s-hold:#7a6a92;--s-hold-bg:#e8e3ef;--over:#b55a52}
:root[data-skin="nordic"] .mine{background:linear-gradient(135deg,#4c8889 0%,#8aa98a 100%);color:#fff}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.notelist{display:flex;flex-direction:column;gap:10px}
.note{padding:14px 16px;text-align:left;width:100%;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.note h3{margin:0;font-size:1rem}
.note .nbody{white-space:pre-wrap;color:var(--muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note .nmeta{font-size:.75rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.note.pinned{border-color:var(--accent);border-width:2px}
#n-body{min-height:300px;font:inherit;line-height:1.7;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.npin{display:flex;gap:8px;align-items:center;font-size:.9rem}
.note .ntag{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;font-weight:700}
.note.needme{border-color:var(--over);border-width:2px}
.note .needtxt{font-size:.85rem;font-weight:700;color:var(--over)}
.note .ok{color:var(--s-done);font-weight:700}
.note.arch{opacity:.6}
.ntg{display:flex;flex-wrap:wrap;gap:6px}
.ntg label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
#n-ok{background:var(--s-done);border-color:var(--s-done);color:var(--surface);font-size:1.05rem;padding:12px 18px}
.nconf{font-size:.88rem;display:flex;flex-direction:column;gap:2px}
/* ===== スマホ用：文字を大きく・太く ===== */
@media (max-width:600px){
  html{font-size:17px}
  body{font-size:18px;line-height:1.6;font-weight:500}
  h1{font-size:1.9rem}
  .title{font-size:1.1rem;font-weight:700}
  .meta{font-size:.88rem;font-weight:500}
  .pill{font-size:.84rem;padding:2px 9px}
  .due{font-size:.95rem;font-weight:700}
  .due em{font-size:.82rem}
  li.task .open{grid-template-columns:4.9rem 1fr;padding:14px 12px}
  .memo1{font-size:.9rem}
  .chip{font-size:1rem;padding:8px 14px;font-weight:700}
  .tabs button{font-size:1.02rem;padding:11px 6px}
  .sum{padding:8px}
  .sum b{font-size:1.55rem}
  .sum span{font-size:.8rem;font-weight:700}
  .mine-head{font-size:1rem;font-weight:700}
  .mine-head select{font-size:1rem;padding:6px 10px}
  .mine-big .who{font-size:1.12rem}
  .mine-big b{font-size:3rem}
  input,select,textarea{font-size:16px;padding:10px 12px}
  textarea.title-in{font-size:1.12rem}
  .btn{font-size:1rem;padding:12px 16px}
  .small-btn{font-size:.92rem;padding:9px 12px}
  .dgrid .btn{font-size:.95rem;padding:12px 8px}
  .fab{font-size:1.08rem;padding:15px 24px}
  .field > label,.field > .lab{font-size:.9rem;font-weight:700}
  .sheet h2{font-size:1.2rem}
  .proj h3{font-size:1.15rem}
  .st-title{font-weight:700}
  .num{flex:0 0 32px;height:32px;font-size:.95rem}
  .note h3{font-size:1.12rem}
  .note .nbody{font-size:.98rem;color:var(--ink)}
  .note .nmeta{font-size:.86rem}
  .note .needtxt{font-size:.95rem}
  .count,.small{font-size:.88rem}
  .arc{font-size:.88rem;padding:9px 12px}
  .people label,.ntg label{font-size:1rem;padding:6px 12px}
  .toast{font-size:1rem}
}
/* 賃貸革命入力 */
.fabs{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:flex-end}
.fabs .fab{position:static}
.fab.alt{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
#c-note{min-height:7.5em;resize:vertical;font-size:1rem;line-height:1.6;width:100%;box-sizing:border-box;white-space:pre-wrap;overflow-x:hidden}
.arc.cin{background:var(--surface);border:2px dashed var(--s-done);color:var(--s-done);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25;text-align:center}
.arc.cin .box{font-size:1.3em;line-height:1}
.arc.cin:active,.arc.cin.on{background:var(--s-done);color:var(--surface);border-style:solid}
.amt{display:flex;align-items:center;gap:6px}.amt input{flex:1;min-width:0}
.preview{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-weight:700;overflow-wrap:anywhere}


/* フォント：見出し・数字は極太ゴシック、本文はまる文字 */
body{font-weight:700}
.title,.tabs button,.chip,.btn,.fab,.pill,.mine-big .who,.sum span,.st-title,.proj h3,.note h3,.kk-say{font-weight:800}
.sum b,.mine-big b,.prog b{font-weight:400}
h1 small{font-weight:800;letter-spacing:.1em}
.due{font-family:var(--f-body);font-weight:800}
.sum b,.mine-big b{font-family:var(--f-display);font-weight:400}
.tabs button[aria-selected="true"]{font-weight:900}
/* ===== カー君 ===== */
:root{--kk-body:#a5a4a5;--kk-beak:#a5a4a5;--kk-leg:#a5a4a5;--kk-line:#ffffff;--kk-acc:#4a7fb5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-skin]){--kk-body:#9b9a9b;--kk-beak:#9b9a9b;--kk-leg:#9b9a9b;--kk-line:#352b26}}
:root[data-skin="vivid"]{--kk-body:#1f5fbf;--kk-beak:#1f5fbf;--kk-leg:#1f5fbf;--kk-acc:#f2b705}
:root[data-skin="candy"]{--kk-body:#bfb2e3;--kk-beak:#bfb2e3;--kk-leg:#bfb2e3;--kk-acc:#f3b9cb}
:root[data-skin="stripe"]{--kk-body:#2c5a9c;--kk-beak:#2c5a9c;--kk-leg:#2c5a9c;--kk-acc:#d24646}
:root[data-skin="tiger"]{--kk-body:url(#kkTiger);--kk-beak:#e8892b;--kk-leg:#2b2622;--kk-acc:#e8892b}
:root[data-skin="nordic"]{--kk-body:#7fa3a3;--kk-beak:#7fa3a3;--kk-leg:#7fa3a3;--kk-acc:#4c8889}
:root[data-skin="camo"]{--kk-body:url(#kkCamo);--kk-beak:#6f7a4a;--kk-leg:#6f7a4a;--kk-acc:#b8a26a}
.kksvg{display:block;width:100%;height:100%;overflow:visible}
header{align-items:center}
header .hright{flex-basis:100%}
.kk-buddy{display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit;margin-left:auto}
.kk-buddy .kk{width:58px;height:54px;flex:0 0 auto}
.kk-say{position:relative;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:5px 9px;font-size:.74rem;font-weight:700;line-height:1.35;max-width:8.6em;text-align:left}
.kk-say::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:0;border-left-color:var(--line)}
.kk-empty{display:flex;flex-direction:column;align-items:center;gap:6px}
.kk-empty .kk{width:110px;height:100px;opacity:.95}
.toast{display:flex;align-items:center;gap:8px}
.toast .kk{width:30px;height:28px;flex:0 0 auto}
.pin-kk{width:96px;height:88px;align-self:center}
@media (prefers-reduced-motion:no-preference){
  .kk-buddy .kk{animation:kkwave 3.2s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes kkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes kkwave{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
}
@media (max-width:600px){.kk-say{font-size:.72rem}}

const DONE=new Set(["完了","確認済み","完了 請求書作成","完了アーカイブ","確認済みアーカイブ"]);
const ARCH=new Set(["完了アーカイブ","確認済みアーカイブ"]);
const WAITING="前工程待ち";
// いつやるか：施工日／締切日（日付あり）・なるべく早く／時間ができたら（日付なし）。report.dk に入れる
const DKS=["施工日","締切日","なるべく早く","時間ができたら"];
const NODATE=new Set(["なるべく早く","時間ができたら"]);
const dkOf=t=>{const k=t.report&&t.report.dk;return DKS.includes(k)?k:"締切日"};
// 完了した日を report.doneAt に入れる（作業記録シートで使う）
function withDone(t,status,rep){const r={...(rep||t.report||{})};if(DONE.has(status)){if(!r.doneAt)r.doneAt=ymd(new Date())}else delete r.doneAt;return r}
const PRESETS={
  "工事":["見積作成","施工","請求書作成"],
  "修繕・手配":["現地確認","業者手配","作業","完了報告","請求書作成"],
  "納品・持参":["準備","持っていく","完了報告"]
};
let projects=[],notes=[],VIEW="tasks",NQ="";
try{const v=localStorage.getItem("ckview");VIEW=(v==="projects"||v==="notes")?v:"tasks"}catch(_){}
const CATS=["管理","工事","事務","民泊清掃","情報共有"];
const BASE_PEOPLE=["吉田","森","宮脇","浅井","姫野","冨田","栗田","民泊","アズル","情報共有"];
const BASE_PROPS=["パークタウンM","UR緑苑東","第二ヴィラあさの"];
const STCLASS=s=>({"未着手":"todo","進行中":"doing","前工程待ち":"next","施工日決定待ち":"wait","施工待ち":"wait","見積送信済":"wait","未確認":"check","確認済み":"done","完了":"done","完了 請求書作成":"done","完了アーカイブ":"arch","確認済みアーカイブ":"arch","保留":"hold"}[s]||"todo");
const arcStatus=s=>s==="確認済み"?"確認済みアーカイブ":"完了アーカイブ";
const isOpen=t=>!DONE.has(t.status)&&t.status!==WAITING;
// 並び順：すぐ作業できる → 待ち（前工程・施工日・見積・保留）→ 完了
const WAIT_ST=new Set(["前工程待ち","施工日決定待ち","施工待ち","見積送信済","保留"]);
const grp=t=>DONE.has(t.status)?2:WAIT_ST.has(t.status)?1:0;
// 手で並べ替えた順番は report.ord に入れる（みんなで同じ順番になる）
const ordOf=t=>{const o=t.report&&t.report.ord;return o===undefined||o===null||o===""||isNaN(Number(o))?null:Number(o)};
let REORDER=false;const PEND={};let ordTimer=null,ordBusy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ASSETS=true,canWrite=true,tasks=[],loaded=false,ME="",PEOPLE=[];const THUMBS={};
const F={q:"",status:"open",cat:"",who:"",quick:""};
try{ME=localStorage.getItem("ckme")||"";F.who=ME;}catch(e){}
function setMe(n){ME=n;F.who=n;F.quick="";try{localStorage.setItem("ckme",n)}catch(_){}render()}

function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function daysLeft(s){const d=parseD(s);return d?Math.round((d-today())/864e5):null}
const WD="日月火水木金土";
function fmtDue(s){const d=parseD(s);if(!d)return "";const y=d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+"/":"";return `${y}${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}

function fillSelects(){
  $("f-status").innerHTML=`<option value="open">アーカイブ以外</option>`+STATUSES.filter(s=>!ARCH.has(s)).map(s=>`<option>${s}</option>`).join("")+`<option value="arch">アーカイブ</option><option value="all">すべて</option>`;
  $("f-cat").innerHTML=`<option value="">カテゴリ：すべて</option>`+CATS.map(c=>`<option>${c}</option>`).join("");
  $("f-status").value=F.status;
}
function people(){const s=new Set(PEOPLE.length?PEOPLE:BASE_PEOPLE);if(PEOPLE.length)BASE_PEOPLE.filter(p=>p==="情報共有"||p==="民泊").forEach(p=>s.add(p));tasks.forEach(t=>(t.assignees||[]).forEach(p=>s.add(p)));return [...s]}
function clients(){const s=new Set();tasks.forEach(t=>t.client&&s.add(t.client));return [...s].sort()}
// 業者名（一度入れた業者は一覧に出る。新しく使った順）
function vendors(){const m=new Map();tasks.forEach(t=>{const v=t.report&&t.report.vendor;if(v)m.set(v,Math.max(m.get(v)||0,t.updatedAt||0))});return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
const isVendorTask=t=>/業者|手配|外注/.test(t.title||"")||!!(t.report&&t.report.vendor);
function props(){const s=new Set(BASE_PROPS);tasks.forEach(t=>t.property&&s.add(t.property));return [...s]}
function isDone(t){return DONE.has(t.status)}
// タイトル先頭の①〜⑳を番号として読む（番号付きの依頼を1から順に並べる）
function circ(s){const c=String(s||"").trim().codePointAt(0);return c>=0x2460&&c<=0x2473?c-0x245F:0}

function visible(){
  const q=F.q.trim().toLowerCase();
  return tasks.filter(t=>{
    if(F.status==="open"&&ARCH.has(t.status))return false;
    if(F.status==="arch"&&!ARCH.has(t.status))return false;
    if(!["open","arch","all"].includes(F.status)&&t.status!==F.status)return false;
    if(F.cat&&t.category!==F.cat)return false;
    if(F.who&&!(t.assignees||[]).includes(F.who))return false;
    if(F.quick){const dl=daysLeft(t.due);
      if(F.quick==="over"&&!(dl!==null&&dl<0&&isOpen(t)))return false;
      if(F.quick==="week"&&!(dl!==null&&dl>=0&&dl<=7&&isOpen(t)))return false;
      if(F.quick==="doing"&&t.status!=="進行中")return false;
      if(F.quick==="todo"&&t.status!=="未着手")return false;}
    if(q&&!`${t.title} ${t.property||""} ${t.client||""} ${(t.report&&t.report.vendor)||""} ${t.memo||""}`.toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>{
    const ga=grp(a),gb=grp(b);if(ga!==gb)return ga-gb;
    const oa=ordOf(a),ob=ordOf(b);
    if(oa!==null&&ob!==null&&oa!==ob)return oa-ob;
    if((oa===null)!==(ob===null))return oa===null?-1:1; // 並べ替えていない新しいタスクは上に出す
    const dkey=t=>{const k=dkOf(t);return k==="なるべく早く"?"0000":k==="時間ができたら"?"99999":(t.due||"9999")};const da=dkey(a),dbb=dkey(b);if(da!==dbb)return da<dbb?-1:1;
    const pr={High:0,Medium:1,Low:2};const pa=pr[a.priority]??3,pb=pr[b.priority]??3;if(pa!==pb)return pa-pb;
    const na=circ(a.title),nb=circ(b.title);
    if(na&&nb)return na-nb;
    if(na||nb)return na?-1:1;
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
}

const KK={"run": "<g><path d=\"M200,285 L250,330 L285,322\" fill=\"none\" style=\"stroke:var(--kk-leg)\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M200,285 L250,330 L285,322\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M165,275 L120,318 L88,306\" fill=\"none\" style=\"stroke:var(--kk-leg)\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M165,275 L120,318 L88,306\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><g transform=\"rotate(12,180,200)\"><path d=\"M222,52 C215,100 160,112 115,126 C75,140 45,160 36,172 L8,228 C35,245 70,246 96,238 C125,282 168,302 212,300 C262,298 292,258 292,205 L288,108 Z\" style=\"fill:var(--kk-body)\"/><circle cx=\"262\" cy=\"70\" r=\"60\" style=\"fill:var(--kk-body)\"/><path d=\"M298,52 C330,58 352,74 362,96 C340,100 315,100 296,98 Z\" style=\"fill:var(--kk-beak);stroke:var(--kk-line)\"  stroke-width=\"6\" stroke-linejoin=\"round\"/><path d=\"M302,82 L346,86\" style=\"stroke:var(--kk-line)\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M240,62 Q254,74 270,64\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M30,214 L92,214\" style=\"stroke:var(--kk-line)\" stroke-width=\"5\" stroke-linecap=\"round\"/></g><g transform=\"translate(175,160) rotate(20) scale(1.0)\"><path d=\"M0,-20 C-40,-32 -95,-26 -130,-6 L-112,4 L-126,15 L-100,20 L-112,30 C-70,36 -25,28 0,20 Z\" style=\"fill:var(--kk-body);stroke:var(--kk-line)\"  stroke-width=\"6\" stroke-linejoin=\"round\"/></g></g>", "wave": "<g><g transform=\"translate(160,140) rotate(62) scale(1.05)\"><path d=\"M0,-20 C-40,-32 -95,-26 -130,-6 L-112,4 L-126,15 L-100,20 L-112,30 C-70,36 -25,28 0,20 Z\" style=\"fill:var(--kk-body);stroke:var(--kk-line)\"  stroke-width=\"6\" stroke-linejoin=\"round\"/></g><path d=\"M150,275 L98,328 L70,330\" fill=\"none\" style=\"stroke:var(--kk-leg)\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M150,275 L98,328 L70,330\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M205,292 L228,340 L262,340\" fill=\"none\" style=\"stroke:var(--kk-leg)\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M205,292 L228,340 L262,340\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><g transform=\"rotate(0,180,200)\"><path d=\"M222,52 C215,100 160,112 115,126 C75,140 45,160 36,172 L8,228 C35,245 70,246 96,238 C125,282 168,302 212,300 C262,298 292,258 292,205 L288,108 Z\" style=\"fill:var(--kk-body)\"/><circle cx=\"262\" cy=\"70\" r=\"60\" style=\"fill:var(--kk-body)\"/><path d=\"M298,52 C330,58 352,74 362,96 C340,100 315,100 296,98 Z\" style=\"fill:var(--kk-beak);stroke:var(--kk-line)\"  stroke-width=\"6\" stroke-linejoin=\"round\"/><path d=\"M302,82 L346,86\" style=\"stroke:var(--kk-line)\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M240,62 Q254,74 270,64\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M30,214 L92,214\" style=\"stroke:var(--kk-line)\" stroke-width=\"5\" stroke-linecap=\"round\"/></g></g>", "tool": "<g><path d=\"M155,278 L120,330 L92,332\" fill=\"none\" style=\"stroke:var(--kk-leg)\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M155,278 L120,330 L92,332\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M205,292 L222,338 L255,342\" fill=\"none\" style=\"stroke:var(--kk-leg)\" stroke-width=\"20\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M205,292 L222,338 L255,342\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><g transform=\"rotate(-6,180,200)\"><path d=\"M222,52 C215,100 160,112 115,126 C75,140 45,160 36,172 L8,228 C35,245 70,246 96,238 C125,282 168,302 212,300 C262,298 292,258 292,205 L288,108 Z\" style=\"fill:var(--kk-body)\"/><circle cx=\"262\" cy=\"70\" r=\"60\" style=\"fill:var(--kk-body)\"/><path d=\"M298,52 C330,58 352,74 362,96 C340,100 315,100 296,98 Z\" style=\"fill:var(--kk-beak);stroke:var(--kk-line)\"  stroke-width=\"6\" stroke-linejoin=\"round\"/><path d=\"M302,82 L346,86\" style=\"stroke:var(--kk-line)\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M240,62 Q254,74 270,64\" fill=\"none\" style=\"stroke:var(--kk-line)\" stroke-width=\"8\" stroke-linecap=\"round\"/><path d=\"M30,214 L92,214\" style=\"stroke:var(--kk-line)\" stroke-width=\"5\" stroke-linecap=\"round\"/></g><g transform=\"translate(335,215) rotate(-30) scale(1.45)\"><rect x=\"-10\" y=\"-70\" width=\"20\" height=\"120\" rx=\"10\" style=\"fill:var(--kk-acc);stroke:var(--kk-line)\"  stroke-width=\"5\"/><path d=\"M-30,-95 A32,32 0 1 0 30,-95 L14,-95 L14,-78 L-14,-78 L-14,-95 Z\" style=\"fill:var(--kk-acc);stroke:var(--kk-line)\"  stroke-width=\"5\" stroke-linejoin=\"round\"/></g><g transform=\"translate(215,180) rotate(195) scale(0.95)\"><path d=\"M0,-20 C-40,-32 -95,-26 -130,-6 L-112,4 L-126,15 L-100,20 L-112,30 C-70,36 -25,28 0,20 Z\" style=\"fill:var(--kk-body);stroke:var(--kk-line)\"  stroke-width=\"6\" stroke-linejoin=\"round\"/></g></g>"};
function kk(pose){return `<svg class="kksvg" viewBox="-15 -10 400 365" aria-hidden="true">${KK[pose]||KK.wave}</svg>`}
function kkEl(pose){return `<span class="kk">${kk(pose)}</span>`}
function paintKK(){document.querySelectorAll(".kk[data-pose]").forEach(e=>{if(!e.firstChild)e.innerHTML=kk(e.dataset.pose)})}
const KK_CHEER=["今日もがんばろう！","安全運転でね","水分とってね","いつもありがとう！","ひとつずつ片付けよう","休けいも大事だよ"];
let kkTap=0;
function kkSay(over,left,week){
  const el=$("kkSay");if(!el)return;
  if(!loaded){el.textContent="読み込み中…";return}
  if(kkTap){el.textContent=KK_CHEER[kkTap%KK_CHEER.length];return}
  el.textContent=over>0?`期限切れが${over}件あるよ！`:left===0?"ぜんぶ終わり！おつかれさま":week>0?`7日以内が${week}件あるよ`:"今日もがんばろう！";
}
function render(){
  // summary（選んでいる人の分だけ数える）
  const ps=people();
  const scope=tasks.filter(t=>!F.who||(t.assignees||[]).includes(F.who));
  const open=scope.filter(isOpen);
  const setN=(id,n)=>{const el=$(id);el.textContent=loaded?n:"–";el.parentElement.classList.toggle("zero",loaded&&n===0)};
  setN("n-over",open.filter(t=>{const d=daysLeft(t.due);return d!==null&&d<0}).length);
  setN("n-week",open.filter(t=>{const d=daysLeft(t.due);return d!==null&&d>=0&&d<=7}).length);
  setN("n-doing",open.filter(t=>t.status==="進行中").length);
  setN("n-todo",open.filter(t=>t.status==="未着手").length);
  $("n-left").textContent=loaded?open.length:"–";
  {const ov=open.filter(t=>{const d=daysLeft(t.due);return d!==null&&d<0}).length,wk=open.filter(t=>{const d=daysLeft(t.due);return d!==null&&d>=0&&d<=7}).length;kkSay(ov,open.length,wk)}
  $("mineWho").textContent=F.who?(F.who===ME?`${F.who}さん（わたし）の残り`:`${F.who}さんの残り`):"全員の残り";
  document.querySelectorAll(".sum").forEach(b=>b.setAttribute("aria-pressed",String(F.quick===b.dataset.quick)));
  $("me").innerHTML=`<option value="">選んでください</option>`+ps.map(p=>`<option ${p===ME?"selected":""}>${esc(p)}</option>`).join("");
  $("ask").hidden=!!ME;
  if(!ME)$("askPick").innerHTML=ps.filter(p=>p!=="情報共有"&&p!=="民泊").map(p=>`<button class="chip" data-me="${esc(p)}">${esc(p)}</button>`).join("");
  // who chips
  $("who").innerHTML=[`<button class="chip" data-who="" aria-pressed="${!F.who}">全員</button>`].concat(ps.map(p=>`<button class="chip" data-who="${esc(p)}" aria-pressed="${F.who===p}">${esc(p)}</button>`)).join("");
  // tabs
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===VIEW)));
  $("taskView").hidden=VIEW!=="tasks";$("projView").hidden=VIEW!=="projects";$("noteView").hidden=VIEW!=="notes";noteBadge();$("who").hidden=VIEW==="notes";
  $("add").textContent=VIEW==="notes"?"＋ ノート追加":VIEW==="projects"?"＋ プロジェクト作成":"＋ タスク追加";
  $("addCin").hidden=VIEW!=="tasks";
  if(!loaded)return;
  if(VIEW==="notes"){renderNotes();return}
  if(VIEW==="projects"){renderProjects();return}
  const v=visible();
  $("count").textContent=`${v.length}件表示 ／ 全${tasks.length}件`;
  if(!v.length){$("list").innerHTML=`<li class="empty"><div class="kk-empty">${kkEl("wave")}<span>${tasks.length?"条件に合うタスクはありません。":"まだタスクがありません。右下の「＋ タスク追加」から登録できます。"}</span></div></li>`;return}
  const showSplit=F.status==="open";
  const act=showSplit?v.filter(t=>!DONE.has(t.status)):v;
  const fin=showSplit?v.filter(t=>DONE.has(t.status)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)):[];
  $("ordToggle").setAttribute("aria-pressed",String(REORDER));$("ordToggle").textContent=REORDER?"✓ 並べ替え終了":"↕ 並べ替え";
  $("ordReset").hidden=!REORDER;$("ordHint").textContent=REORDER?"▲▼で順番を変えられます（みんなの画面も同じ順番になります）":"";
  const now=act.filter(t=>grp(t)===0),wt=act.filter(t=>grp(t)===1);
  const head=showSplit&&wt.length?`<li class="sect now">すぐ作業できる ${now.length}件</li>`:"";
  const mid=showSplit&&wt.length?`<li class="sect wait">待ち（前工程・施工日・見積・保留） ${wt.length}件<span>前の作業や返事が終わると上に上がります</span></li>`:"";
  const rows=list=>list.map((t,i)=>row(t,i,list.length)).join("");
  $("list").innerHTML=(showSplit?head+rows(now)+mid+rows(wt):rows(act))+(fin.length?`<li class="sect">完了・確認済み（アーカイブ前） ${fin.length}件<span>確認したら「アーカイブ」で一覧から外せます</span></li>`+fin.map(row).join(""):"");
}
function row(t,i,n){
    const dl=daysLeft(t.due);let cls="",tag="";const dk=dkOf(t);
    if(dl!==null&&isOpen(t)){if(dl<0){cls="over";tag=dk==="施工日"?"施工日過ぎ":"期限切れ"}else if(dl===0){cls="over";tag="今日"}else if(dl<=3){cls="soon";tag=`あと${dl}日`}}
    const dueHtml=dk==="なるべく早く"?`<span class="due asap">なるべく<br>早く</span>`:dk==="時間ができたら"?`<span class="due later">時間が<br>できたら</span>`:`<span class="due ${cls}">${t.due?`<em class="dkl">${dk==="施工日"?"施工":"締切"}</em>`+fmtDue(t.due):"期限なし"}${tag?`<em>${tag}</em>`:""}</span>`;
    const memo=(t.memo||"").split(/\n/)[0];
    const canArc=canWrite&&DONE.has(t.status)&&!ARCH.has(t.status);
    const canCin=canWrite&&isCin(t)&&!DONE.has(t.status);
    const mv=REORDER&&canWrite&&!DONE.has(t.status)&&i!==undefined;
    return `<li class="task ${DONE.has(t.status)?"is-done":""} ${grp(t)===1?"is-wait":""}"><button class="open" data-id="${esc(t.id)}">
      ${dueHtml}
      <span class="main">
        <span class="title ${t.priority==="High"?"hi":""}">${esc(t.title)}</span>
        <span class="meta"><span class="pill st-${STCLASS(t.status)}">${esc(t.status)}</span>
          ${t.projectId?`<span class="projtag">▸ ${esc(t.projectName||"プロジェクト")} ${(t.step??0)+1}/${t.stepTotal||"?"}</span>`:""}
          ${(t.assignees||[]).length?`<span>👤 ${esc(t.assignees.join("・"))}</span>`:""}
          ${t.property?`<span>🏢 ${esc(t.property)}</span>`:""}
          ${t.client?`<span>🤝 ${esc(t.client)}</span>`:""}
          ${t.report&&t.report.vendor?`<span>🔧 ${esc(t.report.vendor)}</span>`:""}
          ${t.category?`<span>${esc(t.category)}</span>`:""}
          ${(t.attachments||[]).filter(a=>a.kind==="file").length?`<span>📎${t.attachments.filter(a=>a.kind==="file").length}</span>`:""}
          ${(t.attachments||[]).some(a=>a.kind==="report")?`<span class="rep">📷完了報告あり</span>`:""}
          ${t.report&&t.report.req==="依頼中"?`<span class="repreq">📄報告書 作成待ち</span>`:t.report&&t.report.req==="作成済"?`<span class="rep">📄報告書 作成済</span>`:""}
          ${t.report&&t.report.sReq==="依頼中"?`<span class="repreq">🔧修繕報告書 作成待ち</span>`:t.report&&t.report.sReq==="作成済"?`<span class="rep">🔧修繕報告書 作成済</span>`:""}</span>
        ${memo?`<span class="memo1">${esc(memo)}</span>`:""}
      </span></button>${mv?`<span class="mv"><button data-mv="up" data-mid="${esc(t.id)}" aria-label="上へ" ${i===0?"disabled":""}>▲</button><button data-mv="down" data-mid="${esc(t.id)}" aria-label="下へ" ${i===n-1?"disabled":""}>▼</button></span>`:canCin?`<button class="arc cin" data-cin="${esc(t.id)}" aria-label="賃貸革命に入力したら押す"><span class="box">☐</span><span>入力したら<br>押す</span></button>`:canArc?`<button class="arc" data-arc="${esc(t.id)}">アーカイブ</button>`:""}</li>`;
}

function apiGs(fn,args){return new Promise(function(ok,ng){google.script.run.withSuccessHandler(ok).withFailureHandler(ng).apiCall(getPin(),ME||"",fn,args)})}

function toast(m){const el=$("toast");el.innerHTML=kkEl("run")+`<span>${esc(m)}</span>`;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

function calUrl(t){
  if(!t.due)return "";const d=parseD(t.due);const n=new Date(d);n.setDate(n.getDate()+1);
  const f=x=>`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,"0")}${String(x.getDate()).padStart(2,"0")}`;
  const details=[t.property&&`物件：${t.property}`,(t.assignees||[]).length&&`担当：${t.assignees.join("・")}`,t.memo].filter(Boolean).join("\n");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${f(d)}/${f(n)}&details=${encodeURIComponent(details)}`;
}

    ${(()=>{const r=t.report||{};const has=r.sWork||r.sCause||r.sReq;const isRep=/修繕|修理|交換|補修|工事|設置|取付|取替|球切れ|水漏れ/.test(t.title||"")||t.category==="工事";return `<details class="field repbox shubox" ${has||isRep?"open":""}><summary>🔧 修繕完了報告書の内容</summary>

      <span class="small">写真は上の「作業の写真（ビフォー・アフター）」に入れてください。依頼人・物件名・この欄・写真で修繕完了報告書を作り、依頼主のメールあての下書き（PDF添付）まで用意します。メールが空のときは、依頼主の名前でGmailのやり取りから探して入れます。送信は吉田さんが確認してから行います。</span>
      ${id?`<div class="reqbar">${r.sReq==="依頼中"?`<span class="st repreq">📄 作成依頼済み${r.sReqAt?"（"+new Date(r.sReqAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})+"）":""}</span>${ro?"":`<button type="button" class="btn small-btn" id="s-cancelreq">依頼を取り消す</button>`}`

    ${t.due?`<div class="calbox"><a class="btn cal" href="${calUrl(t)}" target="_blank" rel="noopener">📅 Googleカレンダーに追加</a><span class="small">追加したあと、Googleカレンダー側で「前日に通知」などを設定するとリマインダーになります。</span></div>`:""}

  const close=()=>{$("sheetHost").innerHTML=""};
  const drawAtts=()=>{for(const k of ["file","report","before"]){const box=$("att-"+k);if(!box)continue;const list=atts.filter(a=>a.kind===k);

    const need=atts.filter(a=>String(a.type).startsWith("image/")&&!(a.id in THUMBS)).map(a=>a.id);
    if(need.length)api("apiThumbs",need).then(m=>{Object.assign(THUMBS,m);document.querySelectorAll("img[data-thumb]").forEach(im=>{const s=THUMBS[im.dataset.thumb];if(s)im.src=s})}).catch(()=>{});};
  drawAtts();
  const saveAtts=async()=>{if(id){try{apply(await api("apiSaveTask",{id,attachments:atts}))}catch(e){toast("添付の保存に失敗しました。もう一度お試しください")}}};
  const msg=m=>{const el=$("up-msg");if(!el)return;el.hidden=!m;el.textContent=m||""};
  const handle=async(files,kind)=>{
    for(const f of files){
      msg(`「${f.name}」をアップロード中…`);

        else if(p.blob.size>20*1024*1024)throw fail("ファイルが大きすぎます（20MBまで）");
        const dataUrl=await new Promise((ok,ng)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=ng;fr.readAsDataURL(p.blob)});

    msg("");toast(id?"添付しました":"添付しました（保存を押すと登録されます）");

  if($("e-addp"))$("e-addp").onclick=()=>{const n=$("e-newp").value.trim();if(!n)return;const box=$("e-people");const i=box.children.length;box.insertAdjacentHTML("beforeend",`<label><input type="checkbox" id="e-p${i}" value="${esc(n)}" checked>${esc(n)}</label>`);$("e-newp").value=""};
  let reqSet=null;
  const vIn=$("e-vendor");
  $("form").addEventListener("click",e=>{const v=e.target.closest("[data-vendor]");if(v&&vIn){vIn.value=v.dataset.vendor}});
  if($("r-req"))$("r-req").onclick=()=>{
    if(!atts.some(a=>a.kind==="report")){toast("先に「完成（アフター）」の写真を追加してください");return}

    reqSet="依頼中";$("form").requestSubmit()};
  if($("r-cancelreq"))$("r-cancelreq").onclick=()=>{reqSet="";$("form").requestSubmit()};
  let sReqSet=null;
  if($("s-req"))$("s-req").onclick=()=>{
    if(!atts.some(a=>a.kind==="report")){toast("先に「完成（アフター）」の写真を追加してください");return}
    if(!$("r-swork").value.trim()){toast("作業内容を入れてください");$("r-swork").focus();return}
    const m=$("r-smail").value.trim();if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){toast("依頼主のメールアドレスを確認してください");$("r-smail").focus();return}
    sReqSet="依頼中";$("form").requestSubmit()};
  if($("s-cancelreq"))$("s-cancelreq").onclick=()=>{sReqSet="";$("form").requestSubmit()};
  if($("r-prev"))$("r-prev").onclick=()=>{const pr=$("e-prop").value.trim();
    const prev=tasks.filter(x=>x.id!==id&&x.report&&x.report.work&&(pr?x.property===pr||String(x.title).includes(pr):true)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
    if(!prev){toast(pr?`「${pr}」の前回の作業内容が見つかりません`:"先に物件名を入れてください");return}
    $("r-work").value=prev.report.work;if(!$("r-staff").value&&prev.report.staff)$("r-staff").value=prev.report.staff;toast("前回の作業内容を入れました")};
  if($("e-del"))$("e-del").onclick=async e=>{
    const b=e.currentTarget;if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="本当に削除する";return}
    try{apply(await api("apiDeleteTask",id));close();toast("削除しました")}catch(err){toast(errMsg(err))}};
  if(id&&t.updatedBy){const w=t.updatedAt?new Date(t.updatedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";$("e-who").textContent=`最終更新：${t.updatedBy}${w?"（"+w+"）":""}`}
  $("form").addEventListener("submit",async e=>{
    e.preventDefault();if(ro)return;

      assignees:[...document.querySelectorAll("#e-people input:checked")].map(x=>x.value),memo:$("e-memo").value,attachments:atts,
      report:{...(t.report||{}),staff:$("r-staff").value.trim(),work:$("r-work").value.trim(),notes:$("r-notes").value.trim(),remarks:$("r-remarks").value.trim()}};
    if(vIn)body.report.vendor=vIn.value.trim();
    const dkSel=(document.querySelector("#e-dk input:checked")||{}).value||"締切日";body.report.dk=dkSel;if(NODATE.has(dkSel))body.due="";
    body.report=withDone(t,body.status,body.report);
    if($("r-swork"))Object.assign(body.report,{sDate:$("r-sdate").value||"",sName:$("r-sname").value.trim(),sMail:$("r-smail").value.trim(),sCause:$("r-scause").value.trim(),sWork:$("r-swork").value.trim(),sParts:$("r-sparts").value.trim(),sNotes:$("r-snotes").value.trim()});
    if(sReqSet!==null){body.report.sReq=sReqSet;if(sReqSet){body.report.sReqAt=Date.now();body.report.sReqBy=ME||""}else{delete body.report.sReqAt;delete body.report.sReqBy}}
    if(reqSet!==null){body.report.req=reqSet;if(reqSet){body.report.reqAt=Date.now();body.report.reqBy=ME||""}else{delete body.report.reqAt;delete body.report.reqBy}}
    if(!body.title){$("e-title").focus();return}
    $("e-save").disabled=true;$("e-save").textContent="保存中…";
    try{

    }catch(err){reqSet=null;sReqSet=null;$("e-save").disabled=false;$("e-save").textContent="保存";toast(errMsg(err))}
  });

function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

    </div>

    <div class="row"><button type="button" class="chip" id="c-me">期限：月末</button><button type="button" class="chip" id="c-none">期限なし</button></div>
    <div class="field"><span class="lab">登録されるタスク名</span><div class="preview" id="c-prev">【賃貸革命入力】</div></div>
    <p class="small">賃貸革命に入力し終わったら、一覧の「☐ 入力したら押す」を押すとアーカイブに入ります。</p>
    <div class="actions"><span class="spacer"></span><button type="button" class="btn" id="c-cancel">キャンセル</button><button type="submit" class="btn primary" id="c-save">登録する</button></div>
  </form></div>`;
  const close=()=>{$("sheetHost").innerHTML=""};
  const val=()=>{const prop=$("c-prop").value.trim(),r0=$("c-room").value.trim(),room=/^[0-9０-９A-Za-z\-－]+$/.test(r0)?r0+"号室":r0,what=$("c-what").value.trim(),note=$("c-note").value.trim();
    const n=$("c-amt").value===""?null:Math.round(Number($("c-amt").value));
    const amt=n===null||isNaN(n)?"":n.toLocaleString("ja-JP");
    const n1=note.split(/\n/).map(x=>x.trim()).filter(Boolean);const short=n1.length===1&&n1[0].length<=20?n1[0]:"";
    const title=CIN+[prop+(room?" "+room:""),what,amt&&`${amt}円${short?`（${short}）`:""}`].filter(Boolean).join(" ")+(!amt&&short?`（${short}）`:"")+(note&&!short?"（内訳あり）":"");
    const memo=`賃貸革命に入力：${prop}${room?" "+room:""}　${what}${amt?`　¥${amt}`:""}${note?(short?`（${short}）`:`\n【内訳・補足】\n${note}`):""}`;

function fail(m){const e=new Error(m);e.userMsg=m;return e}
async function prepFile(f){
  const name=f.name||"file";const ext=(name.split(".").pop()||"").toLowerCase();
  if(f.type==="application/pdf"||ext==="pdf")return {blob:f,type:"application/pdf",name};
  if(ext==="csv")return {blob:f,type:"text/csv",name};
  if(ext==="txt")return {blob:f,type:"text/plain",name};
  if((f.type||"").startsWith("video/")||["mp4","mov","m4v","webm","3gp","avi"].includes(ext))return {blob:f,type:f.type||(ext==="mov"?"video/quicktime":"video/mp4"),name};
  if((f.type||"").startsWith("image/")||["heic","heif","jpg","jpeg","png","webp"].includes(ext)){
    if(f.type==="image/gif")return {blob:f,type:"image/gif",name};
    // スマホ写真は縮小してJPEGに（容量を抑え、HEICも開けるように）
    try{
      const url=URL.createObjectURL(f);
      const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url});
      const max=1800,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
      if(!blob)throw 0;
      return {blob,type:"image/jpeg",name:name.replace(/\.[^.]+$/,"")+".jpg"};
    }catch(_){
      if(["image/jpeg","image/png","image/webp"].includes(f.type))return {blob:f,type:f.type,name};
      throw fail("この写真は読み込めませんでした。別の写真か、スクリーンショットでお試しください");
    }
  }
  throw fail("添付できるのは写真・PDF・CSV・テキストです。Excel・WordはPDFにしてから添付してください");
}
function uploadErr(err){const c=err&&err.code;
  if(c==="too_large")return "ファイルが大きすぎます（20MBまで）";
  if(c==="unsupported_type")return "この種類のファイルは添付できません。PDFか写真にしてください";
  if(c==="quota_or_state")return "保存容量がいっぱいです。不要な添付を外してください";
  if(c==="rate_limited")return "少し時間をおいてもう一度お試しください";
  if(c==="not_granted")return "添付する権限がありません（編集者として招待してもらってください）";
  return "アップロードできませんでした。通信状況を確認してもう一度お試しください"}

// ▼ 並べ替え
function moveTask(id,dir){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const g=grp(t),list=visible().filter(x=>grp(x)===g);
  const i=list.indexOf(t),j=dir==="up"?i-1:i+1;if(i<0||j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  list.forEach((x,k)=>{const o=(k+1)*10;if(ordOf(x)!==o)setOrd(x,o)});
  render();queueOrd();
}
function setOrd(t,o){t.report={...(t.report||{})};if(o===null)delete t.report.ord;else t.report.ord=o;PEND[t.id]=o}
function queueOrd(){clearTimeout(ordTimer);ordTimer=setTimeout(flushOrd,1200)}
async function flushOrd(){
  if(ordBusy){queueOrd();return}
  const ids=Object.keys(PEND);if(!ids.length)return;ordBusy=true;let last=null,ng=0;
  for(const id of ids){const t=tasks.find(x=>x.id===id);const o=PEND[id];if(!t){delete PEND[id];continue}
    const rep={...(t.report||{})};if(o===null)delete rep.ord;else rep.ord=o;
    try{last=await api("apiSaveTask",{id,report:rep});if(PEND[id]===o)delete PEND[id]}catch(e){ng++}}
  ordBusy=false;if(last)apply(last);
  if(ng){toast("並び順の保存に失敗したものがあります。もう一度お試しください");Object.keys(PEND).forEach(k=>delete PEND[k]);refresh()}
  else if(Object.keys(PEND).length)queueOrd();else toast("並び順を保存しました");
}
